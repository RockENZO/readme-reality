name: Readme Reality
description: Offline quickstart checks with README line numbers and repository evidence.
author: RockENZO
branding:
  icon: check-circle
  color: green
inputs:
  root:
    description: Repository directory inside GITHUB_WORKSPACE.
    default: '.'
  readme:
    description: Markdown path relative to root.
    default: README.md
outputs:
  errors:
    description: Number of confirmed errors.
  skipped:
    description: Number of unsupported references or commands.
  status:
    description: passed, failed, or partial. A zero exit code is not a runtime verification.
runs:
  using: node24
  main: action/index.cjs
